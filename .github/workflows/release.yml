name: Super Smash Bros. 3DS Recompiled Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag or branch to build
        required: true
        type: string
      publish:
        description: Publish a GitHub Release after all platform builds succeed
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smash-3ds-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: smash-3ds-windows-x86_64.zip
          - os: ubuntu-latest
            container: ubuntu:22.04
            archive: smash-3ds-linux-x86_64.tar.gz
          - os: macos-latest
            archive: smash-3ds-macos-arm64.zip
            dmg: smash-3ds-macos-arm64.dmg
          - os: macos-15-intel
            archive: smash-3ds-macos-x86_64.zip
            dmg: smash-3ds-macos-x86_64.dmg
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates clang curl file git libasound2-dev libudev-dev pkg-config zsync
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build desktop runtime
        run: cargo build --release --locked -p zakuro

      - name: Package Windows executable and ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content recomplauncher.json -Raw | ConvertFrom-Json | Out-Null
          Copy-Item target/release/smash-3ds.exe smash-3ds-windows-x86_64.exe
          Compress-Archive -Path target/release/smash-3ds.exe, README.md, COMPATIBILITY.md, LICENSE, LICENSE-MIT, THIRD_PARTY_NOTICES.md, recomplauncher.json -DestinationPath ${{ matrix.archive }}
          New-Item -ItemType Directory -Force -Path package-check | Out-Null
          Expand-Archive -Path ${{ matrix.archive }} -DestinationPath package-check -Force
          if (!(Test-Path package-check/recomplauncher.json)) { throw "RecompLauncher manifest missing from Windows package" }
          $env:RUST_LOG = 'info'
          target/release/smash-3ds.exe --test-pattern --headless 1 --mute

      - name: Package Linux tarball and AppImage
        if: runner.os == 'Linux'
        run: |
          python3 -m json.tool recomplauncher.json > /dev/null
          tar czf ${{ matrix.archive }} README.md COMPATIBILITY.md LICENSE LICENSE-MIT THIRD_PARTY_NOTICES.md recomplauncher.json -C target/release smash-3ds
          tar -tzf ${{ matrix.archive }} | grep -Fx recomplauncher.json
          sh packaging/appimage.sh target/release/smash-3ds smash-3ds-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./smash-3ds-linux-x86_64.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/recomplauncher.json
          rm -rf squashfs-root
          APPIMAGE_EXTRACT_AND_RUN=1 RUST_LOG=info ./smash-3ds-linux-x86_64.AppImage --test-pattern --headless 1 --mute

      - name: Package macOS app, ZIP and DMG
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${VERSION#v}"
          if [ "$version" = "main" ]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          sh packaging/macos-app.sh target/release/smash-3ds "$version" ${{ matrix.archive }}
          ditto -x -k ${{ matrix.archive }} unpacked
          test -f unpacked/recomplauncher.json
          test -f "unpacked/Super Smash Bros. 3DS Recompiled.app/Contents/Resources/recomplauncher.json"
          app_binary="unpacked/Super Smash Bros. 3DS Recompiled.app/Contents/MacOS/smash-3ds"
          if [ "$(uname -m)" = "x86_64" ]; then
            file "$app_binary" | grep -q 'x86_64'
            "$app_binary" --help >/dev/null
          else
            RUST_LOG=info "$app_binary" --test-pattern --headless 1 --mute
          fi
          mkdir -p dmg-mount
          hdiutil attach ${{ matrix.dmg }} -readonly -nobrowse -mountpoint dmg-mount
          trap 'hdiutil detach dmg-mount -quiet || true' EXIT
          test -f "dmg-mount/Super Smash Bros. 3DS Recompiled.app/Contents/MacOS/smash-3ds"
          hdiutil detach dmg-mount -quiet
          trap - EXIT

      - name: Upload platform ZIP or tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            smash-3ds-linux-x86_64.AppImage*

      - name: Upload standalone Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: smash-3ds-windows-x86_64.exe
          path: smash-3ds-windows-x86_64.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.dmg }}
          path: ${{ matrix.dmg }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ needs.build.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(inputs.tag, 'v')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Super Smash Bros. 3DS Recompiled is an unofficial, game-specific desktop build based on Zakuro and 3dsrecomp.

          Use your own lawfully obtained, decrypted Super Smash Bros. for Nintendo 3DS dump. Matching regional updates and DLC may be placed beside the base-game dump. No game ROM, keys, game assets, generated title-specific C code or compiled game library is included.

          The USA release is listed as playable with AOT-recompiled code by upstream Zakuro. This standalone fork still needs independent gameplay testing.

          Windows x64: run smash-3ds-windows-x86_64.exe or extract the ZIP.
          macOS: open Super Smash Bros. 3DS Recompiled.app from the matching DMG or ZIP.
          Linux x64: run smash-3ds-linux-x86_64.AppImage, or extract the tarball and run ./smash-3ds.

          The macOS app is not notarized. On first launch, allow it in System Settings > Privacy & Security > Open Anyway.
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Super Smash Bros. 3DS Recompiled $TAG" --notes-file notes.md
