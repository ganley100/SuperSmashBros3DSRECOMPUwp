name: Xbox (UWP) packages

# builds the USA and Japan apps as separate signed MSIX packages for Xbox
# Dev Mode. no game code is in them: they interpret the game unless built
# locally with recompiled code, see docs/XBOX.md.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      icon_url:
        description: Link to your own picture (PNG/JPEG) for the app tiles
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: smash-3ds-xbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the platform-independent parts of the Xbox app
        run: |
          cargo test --locked -p zakuro-uwp
          cargo test --locked -p zakuro-uwp --no-default-features --features jpn

  package:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        region: [USA, JPN]
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust with the standard library's source
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Set up the Visual Studio build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, pack and sign
        shell: pwsh
        env:
          # your own tile picture, from the Run workflow form or the
          # repository variable XBOX_ICON_URL; never stored in the repo
          ICON_URL: ${{ inputs.icon_url || vars.XBOX_ICON_URL }}
        run: |
          if ($env:ICON_URL) {
            ./packaging/uwp/build-msix.ps1 -Region ${{ matrix.region }} -Icon $env:ICON_URL
          } else {
            ./packaging/uwp/build-msix.ps1 -Region ${{ matrix.region }}
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: smash-3ds-xbox-${{ matrix.region }}
          path: |
            dist/uwp/*.msix
            dist/uwp/*.cer
            dist/uwp/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
