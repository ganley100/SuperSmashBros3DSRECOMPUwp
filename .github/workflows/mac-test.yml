# Builds the Apple-silicon macOS release package as a temporary Actions artifact.
name: Super Smash Bros. 3DS Recompiled macOS Test Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Vulkan Fragment Shaders"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build desktop runtime
        run: cargo build --release --locked -p zakuro

      - name: Package and smoke-test macOS app
        env:
          VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: |
          version="$VERSION"
          if [ "$version" = "main" ]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          sh packaging/macos-app.sh target/release/smash-3ds "$version" smash-3ds-macos-arm64.zip
          ditto -x -k smash-3ds-macos-arm64.zip unpacked
          test -f unpacked/recomplauncher.json
          test -f "unpacked/Super Smash Bros. 3DS Recompiled.app/Contents/Resources/recomplauncher.json"
          RUST_LOG=info "unpacked/Super Smash Bros. 3DS Recompiled.app/Contents/MacOS/smash-3ds" --test-pattern --headless 1 --mute
          test -f smash-3ds-macos-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: smash-3ds-macos-arm64-test
          path: smash-3ds-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: smash-3ds-macos-arm64-dmg-test
          path: smash-3ds-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 14
