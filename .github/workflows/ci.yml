# Builds and tests Super Smash Bros. for Nintendo 3DS on Linux, macOS and Windows.
name: Super Smash Bros. 3DS Recompiled CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_run:
    workflows: ["Build Vulkan Fragment Shaders"]
    types: [completed]
    branches: [main]

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Sound library headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Fonts for Japanese, so the font tests draw with one
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
      - name: Keep the Windows program
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: smash-3ds-windows
          path: target/release/smash-3ds.exe
